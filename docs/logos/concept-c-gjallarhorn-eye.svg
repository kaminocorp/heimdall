<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="600" height="680">
  <rect width="300" height="340" fill="#080c08" rx="6"/>

  <g transform="translate(150, 150)">
    <!-- Main circle (iris / horn bell) -->
    <circle r="42" fill="none" stroke="#d0ddd0" stroke-width="5.5"/>

    <!-- Pupil / horn throat (solid) -->
    <circle r="14" fill="#d0ddd0"/>

    <!-- Upper chevron (heavy brow) -->
    <!-- Apex above, arms descend past the horizontal midline of circle -->
    <polyline points="-62,12 0,-78 62,12"
              fill="none" stroke="#d0ddd0" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter"/>

    <!-- Lower chevron (thinner, mirrored) -->
    <polyline points="-62,-12 0,78 62,-12"
              fill="none" stroke="#d0ddd0" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>

    <!-- Four diagonal rays (sound waves / sight lines) -->
    <!-- 45° (upper-right) -->
    <line x1="33.9" y1="-33.9" x2="56.6" y2="-56.6"
          stroke="#d0ddd0" stroke-width="5" stroke-linecap="square"/>
    <!-- 135° (upper-left) -->
    <line x1="-33.9" y1="-33.9" x2="-56.6" y2="-56.6"
          stroke="#d0ddd0" stroke-width="5" stroke-linecap="square"/>
    <!-- 225° (lower-left) -->
    <line x1="-33.9" y1="33.9" x2="-56.6" y2="56.6"
          stroke="#d0ddd0" stroke-width="5" stroke-linecap="square"/>
    <!-- 315° (lower-right) -->
    <line x1="33.9" y1="33.9" x2="56.6" y2="56.6"
          stroke="#d0ddd0" stroke-width="5" stroke-linecap="square"/>
  </g>

  <!-- Label -->
  <text x="150" y="295" text-anchor="middle" fill="#5a6b5a"
        font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" letter-spacing="3">
    CONCEPT C
  </text>
  <text x="150" y="315" text-anchor="middle" fill="#3d4d3d"
        font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" letter-spacing="2">
    THE GJALLARHORN EYE
  </text>
</svg>