<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="600" height="680">
  <rect width="300" height="340" fill="#080c08" rx="6"/>

  <g transform="translate(150, 150)">
    <!-- Hexagon boundary (pointy-top, circumradius=100) -->
    <!-- Vertices: top(0,-100), ur(86.6,-50), lr(86.6,50), bottom(0,100), ll(-86.6,50), ul(-86.6,-50) -->
    <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50"
             fill="none" stroke="#d0ddd0" stroke-width="3.5" stroke-linejoin="miter"/>

    <!-- Inner hexagon ring (concentric, r=88) -->
    <polygon points="0,-88 76.2,-44 76.2,44 0,88 -76.2,44 -76.2,-44"
             fill="none" stroke="#d0ddd0" stroke-width="1" stroke-linejoin="miter"/>

    <!-- 6 PRIMARY rays — to vertices (up, then 60° increments) -->
    <!-- Base ray points UP, narrow at inner (r=26), wide at outer (r=82) -->
    <g fill="#d0ddd0">
      <path d="M -3,-26 L -7,-82 L 7,-82 L 3,-26 Z" transform="rotate(0)"/>
      <path d="M -3,-26 L -7,-82 L 7,-82 L 3,-26 Z" transform="rotate(60)"/>
      <path d="M -3,-26 L -7,-82 L 7,-82 L 3,-26 Z" transform="rotate(120)"/>
      <path d="M -3,-26 L -7,-82 L 7,-82 L 3,-26 Z" transform="rotate(180)"/>
      <path d="M -3,-26 L -7,-82 L 7,-82 L 3,-26 Z" transform="rotate(240)"/>
      <path d="M -3,-26 L -7,-82 L 7,-82 L 3,-26 Z" transform="rotate(300)"/>
    </g>

    <!-- 6 SECONDARY rays — to edge midpoints (30° offset, shorter & thinner) -->
    <!-- From r=26 to r=58 -->
    <g fill="#d0ddd0" opacity="0.7">
      <path d="M -2,-26 L -4.5,-58 L 4.5,-58 L 2,-26 Z" transform="rotate(30)"/>
      <path d="M -2,-26 L -4.5,-58 L 4.5,-58 L 2,-26 Z" transform="rotate(90)"/>
      <path d="M -2,-26 L -4.5,-58 L 4.5,-58 L 2,-26 Z" transform="rotate(150)"/>
      <path d="M -2,-26 L -4.5,-58 L 4.5,-58 L 2,-26 Z" transform="rotate(210)"/>
      <path d="M -2,-26 L -4.5,-58 L 4.5,-58 L 2,-26 Z" transform="rotate(270)"/>
      <path d="M -2,-26 L -4.5,-58 L 4.5,-58 L 2,-26 Z" transform="rotate(330)"/>
    </g>

    <!-- Notched tips on primary rays (small triangular cutouts at hex boundary) -->
    <g fill="#080c08">
      <polygon points="-3,-87 0,-80 3,-87" transform="rotate(0)"/>
      <polygon points="-3,-87 0,-80 3,-87" transform="rotate(60)"/>
      <polygon points="-3,-87 0,-80 3,-87" transform="rotate(120)"/>
      <polygon points="-3,-87 0,-80 3,-87" transform="rotate(180)"/>
      <polygon points="-3,-87 0,-80 3,-87" transform="rotate(240)"/>
      <polygon points="-3,-87 0,-80 3,-87" transform="rotate(300)"/>
    </g>

    <!-- Center aperture — double ring -->
    <!-- Outer ring -->
    <circle r="22" fill="none" stroke="#d0ddd0" stroke-width="2.5"/>
    <!-- Inner ring -->
    <circle r="15" fill="none" stroke="#d0ddd0" stroke-width="1.8"/>
    <!-- Void center (the pupil/lens) -->
    <circle r="7" fill="#d0ddd0"/>
  </g>

  <!-- Label -->
  <text x="150" y="295" text-anchor="middle" fill="#5a6b5a"
        font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" letter-spacing="3">
    CONCEPT B
  </text>
  <text x="150" y="315" text-anchor="middle" fill="#3d4d3d"
        font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" letter-spacing="2">
    THE BIFROST HEXAGRAM
  </text>
</svg>