<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="800" height="600">
  <rect width="400" height="300" fill="#080c08" rx="6"/>

  <g transform="translate(200, 130)">
    <!-- Eye shape (almond / vesica piscis) -->
    <path d="M -160,0 C -110,-65 110,-65 160,0 C 110,65 -110,65 -160,0 Z"
          fill="none" stroke="#d0ddd0" stroke-width="3" stroke-linejoin="round"/>

    <!-- Iris outer ring -->
    <circle r="46" fill="none" stroke="#d0ddd0" stroke-width="3"/>

    <!-- Iris inner ring -->
    <circle r="34" fill="none" stroke="#d0ddd0" stroke-width="1.5"/>

    <!-- 6 trapezoidal spokes between inner and outer ring -->
    <!-- Base spoke points RIGHT (+x), rotated in 60° increments -->
    <!-- Narrow at inner ring (r=34), wide at outer ring (r=46) -->
    <g fill="#d0ddd0">
      <path d="M 20,-2.5 L 34,-4 L 34,4 L 20,2.5 Z" transform="rotate(0)"/>
      <path d="M 20,-2.5 L 34,-4 L 34,4 L 20,2.5 Z" transform="rotate(60)"/>
      <path d="M 20,-2.5 L 34,-4 L 34,4 L 20,2.5 Z" transform="rotate(120)"/>
      <path d="M 20,-2.5 L 34,-4 L 34,4 L 20,2.5 Z" transform="rotate(180)"/>
      <path d="M 20,-2.5 L 34,-4 L 34,4 L 20,2.5 Z" transform="rotate(240)"/>
      <path d="M 20,-2.5 L 34,-4 L 34,4 L 20,2.5 Z" transform="rotate(300)"/>
    </g>

    <!-- Larger trapezoidal spokes bridging inner ring to outer ring -->
    <g fill="#d0ddd0">
      <path d="M 36,-3 L 44,-6 L 44,6 L 36,3 Z" transform="rotate(0)"/>
      <path d="M 36,-3 L 44,-6 L 44,6 L 36,3 Z" transform="rotate(60)"/>
      <path d="M 36,-3 L 44,-6 L 44,6 L 36,3 Z" transform="rotate(120)"/>
      <path d="M 36,-3 L 44,-6 L 44,6 L 36,3 Z" transform="rotate(180)"/>
      <path d="M 36,-3 L 44,-6 L 44,6 L 36,3 Z" transform="rotate(240)"/>
      <path d="M 36,-3 L 44,-6 L 44,6 L 36,3 Z" transform="rotate(300)"/>
    </g>

    <!-- Extended horizontal scanning lines from outer ring to eye tips -->
    <line x1="46" y1="0" x2="160" y2="0" stroke="#d0ddd0" stroke-width="2.5"/>
    <line x1="-46" y1="0" x2="-160" y2="0" stroke="#d0ddd0" stroke-width="2.5"/>

    <!-- Pupil (solid) -->
    <circle r="12" fill="#d0ddd0"/>
  </g>

  <!-- Label -->
  <text x="200" y="255" text-anchor="middle" fill="#5a6b5a"
        font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" letter-spacing="3">
    CONCEPT A
  </text>
  <text x="200" y="275" text-anchor="middle" fill="#3d4d3d"
        font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" letter-spacing="2">
    THE WATCHTOWER SIGIL
  </text>
</svg>